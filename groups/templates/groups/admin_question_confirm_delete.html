{% extends 'groups/base.html' %}

{% block title %}Savolni o'chirish{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-md mx-auto px-4">
        <a href="{% url 'admin_question_list' %}" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 mb-4 transition">
            <i class="fas fa-arrow-left mr-1"></i> Orqaga
        </a>
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 text-center">
            <div class="text-6xl mb-4"><i class="fas fa-exclamation-triangle text-yellow-500"></i></div>
            <h2 class="text-xl font-bold text-gray-900 mb-2">Savolni o'chirish</h2>
            <p class="text-gray-600 mb-4">
                "{{ question.question_text|default:question.correct_sentence }}" 
                savolini o'chirmoqchimisiz?
            </p>
            <p class="text-red-500 text-sm mb-6">Bu amalni qaytarib bo'lmaydi!</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                        Ha, o'chirish
                    </button>
                    <a href="{% url 'admin_question_list' %}" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-center">
                        Bekor qilish
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
