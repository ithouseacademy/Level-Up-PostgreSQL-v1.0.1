<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT House - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            text-align: center;
            max-width: 400px;
            padding: 48px 32px;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 12px; }
        p { color: #94a3b8; margin-bottom: 28px; line-height: 1.6; }
        button {
            background: #0059ff;
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0048cc; }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Internet aloqasi yo'q</h1>
        <p>IT House Level Up dan foydalanish uchun internetga ulaning</p>
        <button onclick="location.reload()">Qayta urinish</button>
    </div>
</body>
</html>
